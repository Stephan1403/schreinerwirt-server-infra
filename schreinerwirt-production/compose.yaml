services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: website
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U root -d website
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    image: ghcr.io/stephan1403/schreinerwirt-backend-image:main
    profiles:
      - tools
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - goose
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: host=postgres port=5432 user=root password=${POSTGRES_PASSWORD}
        dbname=website sslmode=disable
      GOOSE_MIGRATION_DIR: /app/db/migrations
    networks:
      - backend
  backend:
    image: ghcr.io/stephan1403/schreinerwirt-backend-image:main
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BESZEL_EMAIL: ${BESZEL_EMAIL}
      BESZEL_PASSWORD: ${BESZEL_PASSWORD}
      BESZEL_SYSTEM_ID: ${BESZEL_SYSTEM_ID}
      UMAMI_USERNAME: ${UMAMI_USERNAME}
      UMAMI_PASSWORD: ${UMAMI_PASSWORD}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID}
      LOG_LEVEL: INFO
      GIN_MODE: release
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_proxy
      - traefik.http.routers.schreinerwirt-production.entrypoints=websecure
      - traefik.http.routers.schreinerwirt-production.rule=Host(`api.schreinerwirt-schwangau.de`)
      - traefik.http.routers.schreinerwirt-production.tls=true
      - traefik.http.routers.schreinerwirt-production.tls.certresolver=letsencrypt
      - traefik.http.services.schreinerwirt-production.loadbalancer.server.port=8080
    networks:
      - backend
      - traefik_proxy
volumes:
  postgres_data: null
networks:
  backend: null
  traefik_proxy:
    external: true
